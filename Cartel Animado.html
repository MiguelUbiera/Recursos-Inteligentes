 
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exploradores del inventario · Orden estable</title>
  <style>
    /* === RESET Y BASE === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #F9F6F0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .app {
      max-width: 1600px;       /* Nueva dimensión */
      width: 100%;
      min-height: 650px;       /* Nueva dimensión */
      background: #FFFFFF;
      border-radius: 40px 40px 32px 32px;
      box-shadow: 0 20px 60px rgba(26, 42, 74, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.3s ease;
    }

    /* === HEADER === */
    .app-header {
      background: #1A2A4A;
      padding: 20px 32px 16px 32px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .app-header .titulo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-header .titulo span {
      background: #F1C40F;
      color: #1A2A4A;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }
    .step-indicator {
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 18px;
      border-radius: 30px;
      font-weight: 600;
      color: #F1C40F;
    }

    /* === MAIN CONTENT === */
    .main-content {
      padding: 32px 40px 28px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 480px;
    }

    /* === STEP === */
    .step {
      display: none;
      flex-direction: column;
      gap: 20px;
      animation: fadeSlide 0.4s ease;
    }
    .step.active {
      display: flex;
    }

    @keyframes fadeSlide {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1A2A4A;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .step-desc {
      font-size: 1.1rem;
      color: #2c3e50;
      line-height: 1.6;
      margin-bottom: 4px;
    }
    .step-desc strong {
      color: #1A2A4A;
    }

    /* === OPCIONES === */
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 12px 0 8px 0;
    }
    .options .opt {
      background: #F0EDE8;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #1A2A4A;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      min-width: 80px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .options .opt:hover {
      background: #e5e0d9;
      transform: scale(1.03);
    }
    .options .opt.correct {
      background: #2ECC71;
      border-color: #1fa85a;
      color: #fff;
      transform: scale(1.04);
    }
    .options .opt.wrong {
      background: #e74c3c;
      border-color: #c0392b;
      color: #fff;
      animation: shake 0.4s ease;
    }
    .options .opt.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-10px);
      }
      75% {
        transform: translateX(10px);
      }
    }

    /* === FEEDBACK === */
    .feedback {
      padding: 16px 24px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 1rem;
      display: none;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      background: #f0f0f0;
      color: #1A2A4A;
    }
    .feedback.show {
      display: flex;
    }
    .feedback.success {
      background: #d5f5e3;
      color: #1a6e3a;
      border-left: 6px solid #2ECC71;
    }
    .feedback.error {
      background: #fadbd8;
      color: #922b21;
      border-left: 6px solid #e74c3c;
    }
    .feedback .fb-icon {
      font-size: 1.8rem;
    }

    /* === INPUT === */
    .input-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .input-group input[type="number"] {
      padding: 14px 22px;
      border-radius: 60px;
      border: 2px solid #d5d0c8;
      font-size: 1.2rem;
      width: 120px;
      text-align: center;
      font-weight: 600;
      background: #fcfaf7;
      transition: border 0.2s;
      font-family: inherit;
    }
    .input-group input:focus {
      border-color: #E67E22;
      outline: none;
      box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.2);
    }
    .input-group button {
      background: #E67E22;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
    }
    .input-group button:hover {
      background: #cf6d17;
      transform: scale(1.03);
    }
    .input-group button:active {
      transform: scale(0.96);
    }

    /* === SECUENCIA (CLICK EN ORDEN) === */
    .seq-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin: 16px 0;
    }
    .seq-item {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #ECEAE5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #1A2A4A;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
      border: 3px solid transparent;
      user-select: none;
    }
    .seq-item:hover {
      transform: scale(1.06);
      background: #ddd8cf;
    }
    .seq-item.done {
      background: #2ECC71;
      color: #fff;
      border-color: #1fa85a;
      cursor: default;
      transform: scale(0.96);
    }
    .seq-item.wrong-flash {
      animation: wrongFlash 0.5s ease;
      border-color: #e74c3c;
    }
    @keyframes wrongFlash {
      0%,
      100% {
        background: #ECEAE5;
      }
      50% {
        background: #f5c6cb;
        border-color: #e74c3c;
      }
    }
    .seq-item.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* === MATCHING === */
    .match-container {
      display: flex;
      gap: 50px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .match-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 120px;
    }
    .match-col .col-label {
      font-weight: 700;
      color: #1A2A4A;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      text-align: center;
    }
    .match-item {
      padding: 14px 22px;
      border-radius: 18px;
      background: #F0EDE8;
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 3px solid transparent;
      user-select: none;
      min-width: 90px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .match-item:hover {
      background: #e5e0d9;
      transform: scale(1.04);
    }
    .match-item.selected {
      border-color: #E67E22;
      background: #fdf0e6;
      transform: scale(1.06);
    }
    .match-item.matched {
      background: #2ECC71;
      color: #fff;
      border-color: #1fa85a;
      cursor: default;
      opacity: 0.7;
      pointer-events: none;
      transform: scale(0.96);
    }
    .match-item.wrong-pair {
      animation: shake 0.4s ease;
      border-color: #e74c3c;
    }

    /* === RECTA NUMÉRICA (fillline) === */
    .numline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 16px 0;
      margin: 8px 0;
    }
    .numline .nl-item {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #ECEAE5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1A2A4A;
    }
    .numline .nl-item.blank {
      background: #fcfaf7;
      border: 3px dashed #c5bdb2;
      padding: 0;
    }
    .numline .nl-item.blank input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      font-family: inherit;
      color: #1A2A4A;
      outline: none;
      border-radius: 18px;
    }
    .numline .nl-item.blank input:focus {
      background: #fff9f0;
      box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.2);
    }
    .numline .nl-item.blank.filled {
      background: #d5f5e3;
      border-color: #2ECC71;
    }

    /* === FINAL === */
    .final-box {
      background: #f0f4f9;
      border-radius: 28px;
      padding: 28px 32px;
      border-left: 8px solid #E67E22;
      margin: 16px 0;
    }
    .final-box .pregunta {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1A2A4A;
      line-height: 1.7;
    }

    /* === BOTONES PRINCIPALES === */
    .btn-primary {
      background: #E67E22;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 16px 44px;
      border-radius: 60px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(230, 126, 34, 0.35);
      align-self: flex-start;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: #cf6d17;
      transform: scale(1.03);
    }
    .btn-primary:active {
      transform: scale(0.96);
    }
    .btn-primary.centered {
      align-self: center;
    }

    /* === CONFETTI === */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-20px) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(720deg) scale(0.4);
      }
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .app-header {
        padding: 16px 20px 12px 20px;
      }
      .app-header .titulo {
        font-size: 1.2rem;
      }
      .step-indicator {
        font-size: 0.85rem;
        padding: 4px 12px;
      }
      .main-content {
        padding: 20px 16px 16px 16px;
        min-height: 400px;
      }
      .step-title {
        font-size: 1.2rem;
      }
      .step-desc {
        font-size: 1rem;
      }
      .options .opt {
        padding: 10px 20px;
        font-size: 1rem;
        min-width: 60px;
      }
      .seq-item {
        width: 56px;
        height: 56px;
        font-size: 1.4rem;
      }
      .match-item {
        padding: 10px 16px;
        font-size: 1rem;
        min-width: 70px;
      }
      .numline .nl-item {
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
      }
      .numline .nl-item.blank input {
        font-size: 1.2rem;
      }
      .final-box {
        padding: 18px 16px;
      }
      .btn-primary {
        padding: 12px 28px;
        font-size: 1rem;
        width: 100%;
        text-align: center;
      }
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }
      .input-group input[type="number"] {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .app-header .titulo {
        font-size: 1rem;
      }
      .step-indicator {
        font-size: 0.7rem;
      }
      .seq-item {
        width: 44px;
        height: 44px;
        font-size: 1.1rem;
      }
      .numline .nl-item {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
      .numline .nl-item.blank input {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- HEADER -->
    <div class="app-header">
      <div class="titulo">
        📚 Exploradores del inventario
        <span>Inicio</span>
      </div>
      <div class="step-indicator" id="stepIndicator">Paso 1 / 12</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent"></div>
  </div>

  <script>
    // ============================================================
    //  DATOS DE LOS 12 PASOS (CORREGIDOS)
    // ============================================================
    const stepsData = [{
      id: 1,
      title: '📦 ¿Cuántos libros hay?',
      desc: 'Observa la caja y haz clic en el número correcto.',
      type: 'choice',
      options: ['7', '9', '11'],
      correct: 1,
      feedbackOk: '🎉 ¡Excelente! Contaste 9 libros.',
      feedbackFail: '👀 Revisa con atención. Cuenta uno por uno.'
    }, {
      id: 2,
      title: '🔢 ¿Qué número sigue?',
      desc: '¿Qué número dirías <strong>después del 8</strong> al contar los libros?',
      type: 'choice',
      options: ['7', '9', '10'],
      correct: 1,
      feedbackOk: '🌟 ¡Muy bien! Después de 8 viene 9.',
      feedbackFail: '🧠 Recuerda: al contar, los números siguen un orden. Después de 8 viene 9.'
    }, {
      id: 3,
      title: '🏁 ¿Por dónde empezamos?',
      desc: '¿Cuál es el <strong>primer número</strong> que dices al empezar a contar los libros?',
      type: 'choice',
      options: ['0', '1', '2'],
      correct: 1,
      feedbackOk: '✅ ¡Bien! Siempre empezamos contando desde 1.',
      feedbackFail: '🔁 El conteo comienza en el número 1.'
    }, {
      id: 4,
      title: '🧩 Cuenta en orden',
      desc: 'Haz clic sobre los números <strong>en la secuencia correcta</strong> (1 → 2 → 3 … 8).',
      type: 'sequence',
      sequence: [1, 2, 3, 4, 5, 6, 7, 8],
      feedbackOk: '🎯 ¡Ordenaste los números!',
      feedbackFail: '⛔ Ese número no sigue el orden.',
      items: [1, 2, 3, 4, 5, 6, 7, 8]
    }, {
      id: 5,
      title: '🔍 ¿Qué número falta?',
      desc: 'Alguien contó: <strong>1, 2, 3, 5, 6, 7</strong>. ¿Qué número falta?',
      type: 'choice',
      options: ['4', '5', '8'],
      correct: 0,
      feedbackOk: '¡Claro! Faltó el 4. Los números siempre van en orden.',
      feedbackFail: 'Observa la secuencia: 1, 2, 3, 5. El número que falta es el que va después de 3.'
    }, {
      id: 6,
      title: '🔴 Cuenta los puntos',
      desc: '¿Cuántos puntos hay dentro del círculo? Escribe la cantidad.',
      type: 'input',
      correct: 6,
      feedbackOk: '🎯 ¡Perfecto! Contaste 6.',
      feedbackFail: 'Revisa: ¿contaste todos los puntos sin repetir?',
      visual: '⚫⚫⚫⚫⚫⚫'
    }, {
      // ===== PASO 7 CORREGIDO (con visual) =====
      id: 7,
      title: '🍎 Señala y cuenta',
      desc: 'Si empiezas a contar por la <strong>manzana</strong>, ¿qué objeto es el <strong>segundo</strong>?',
      type: 'choice',
      options: ['🍌 Banana', '🍊 Naranja', '🍐 Pera'],
      correct: 0,
      feedbackOk: '🌟 ¡Muy bien! El segundo es la banana.',
      feedbackFail: 'Recuerda: el primero es la manzana 🍎, el segundo es la banana 🍌.',
      visual: '🍎 🍌 🍊 🍐' // <--- los objetos en orden
    }, {
      id: 8,
      title: '🧮 Conteo saltado',
      desc: 'Haz clic en la secuencia: <strong>2, 4, 6, 8, 10</strong>.',
      type: 'sequence',
      sequence: [2, 4, 6, 8, 10],
      feedbackOk: '🌟 ¡Excelente! Ese es otro orden de conteo.',
      feedbackFail: 'Debes seguir la secuencia 2, 4, 6, 8, 10.',
      items: [2, 4, 6, 8, 10]
    }, {
      id: 9,
      title: '❓ ¿Qué falta? (1–10)',
      desc: 'Observa: <strong>1, 2, 3, 4, 5, 7, 8, 9, 10</strong>. ¿Qué número falta?',
      type: 'choice',
      options: ['5', '6', '7'],
      correct: 1,
      feedbackOk: '✅ ¡Bien! Faltaba el 6.',
      feedbackFail: 'Observa la secuencia completa: 1, 2, 3, 4, 5, 7, 8, 9, 10. ¿Qué número falta?'
    }, {
      id: 10,
      title: '🔗 Empareja el nombre',
      desc: 'Haz clic en un nombre (izquierda) y luego en el número (derecha) que le corresponde.',
      type: 'matching',
      pairs: [
        { name: 'uno', value: 1 },
        { name: 'dos', value: 2 },
        { name: 'tres', value: 3 },
        { name: 'cuatro', value: 4 },
        { name: 'cinco', value: 5 }
      ],
      feedbackOk: '🎉 ¡Todos los pares están correctos!',
      feedbackFail: 'Ese no es el par correcto.'
    }, {
      id: 11,
      title: '📏 Cuenta en la recta',
      desc: 'Completa los números que faltan en la recta numérica.',
      type: 'fillline',
      visible: [1, 2, 3, 4, 5, 10],
      blanks: [6, 7, 8, 9],
      feedbackOk: '🎯 ¡Completaste la recta!',
      feedbackFail: 'Revisa los números que faltan.'
    }, {
      id: 12,
      title: '🤔 Pregunta para pensar',
      desc: 'Has hecho un gran trabajo. Ahora, una pregunta para reflexionar:',
      type: 'final',
      question: '¿Por qué todos podemos contar los libros si empezamos por diferentes lugares o decimos los números en un orden diferente?',
      buttonText: '🚀 Ir al desarrollo',
      buttonLink: 'desarrollo.html'
    }];

    // ============================================================
    //  ESTADO GLOBAL
    // ============================================================
    let currentStep = 0;
    let stepStates = {};

    // ============================================================
    //  UTILIDADES
    // ============================================================
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function launchConfetti(count = 60) {
      const container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);
      const colors = ['#E67E22', '#F1C40F', '#2ECC71', '#3498db', '#e74c3c', '#9b59b6', '#1A2A4A'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        const size = 6 + Math.random() * 12;
        el.style.width = size + 'px';
        el.style.height = size * (0.5 + Math.random() * 0.9) + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.top = '-10px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = 1.8 + Math.random() * 2.8 + 's';
        el.style.animationDelay = Math.random() * 1.4 + 's';
        el.style.transform = `rotate(${Math.random()*360}deg)`;
        container.appendChild(el);
      }
      setTimeout(() => container.remove(), 5500);
    }

    // ============================================================
    //  RENDERIZADO
    // ============================================================
    const main = document.getElementById('mainContent');
    const indicator = document.getElementById('stepIndicator');

    function renderStep(index) {
      const data = stepsData[index];
      if (!data) return;
      indicator.textContent = `Paso ${index+1} / ${stepsData.length}`;
      main.innerHTML = '';

      const stepDiv = document.createElement('div');
      stepDiv.className = 'step active';

      // Título
      const title = document.createElement('div');
      title.className = 'step-title';
      title.innerHTML = data.title;
      stepDiv.appendChild(title);

      // Descripción
      if (data.desc) {
        const desc = document.createElement('div');
        desc.className = 'step-desc';
        desc.innerHTML = data.desc;
        stepDiv.appendChild(desc);
      }

      const content = document.createElement('div');
      content.style.width = '100%';

      // ---------- TYPE: choice ----------
      if (data.type === 'choice') {
        // Si hay visual, mostrarlo
        if (data.visual) {
          const vis = document.createElement('div');
          vis.style.fontSize = '3rem';
          vis.style.textAlign = 'center';
          vis.style.padding = '10px 0';
          vis.style.letterSpacing = '16px';
          vis.textContent = data.visual;
          content.appendChild(vis);
        }

        const optDiv = document.createElement('div');
        optDiv.className = 'options';
        data.options.forEach((opt, idx) => {
          const btn = document.createElement('div');
          btn.className = 'opt';
          btn.textContent = opt;
          btn.dataset.idx = idx;
          btn.addEventListener('click', () => handleChoice(data, idx, optDiv, stepDiv));
          optDiv.appendChild(btn);
        });
        content.appendChild(optDiv);

        const fb = document.createElement('div');
        fb.className = 'feedback';
        fb.id = 'fb-' + data.id;
        content.appendChild(fb);
      }

      // ---------- TYPE: input ----------
      if (data.type === 'input') {
        if (data.visual) {
          const vis = document.createElement('div');
          vis.style.fontSize = '2.6rem';
          vis.style.textAlign = 'center';
          vis.style.padding = '10px 0';
          vis.textContent = data.visual;
          content.appendChild(vis);
        }
        const group = document.createElement('div');
        group.className = 'input-group';
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.id = 'inp-' + data.id;
        inp.placeholder = '?';
        inp.min = 0;
        inp.max = 20;
        const btn = document.createElement('button');
        btn.textContent = 'Verificar';
        btn.addEventListener('click', () => handleInput(data, inp, group, stepDiv));
        group.appendChild(inp);
        group.appendChild(btn);
        content.appendChild(group);

        const fb = document.createElement('div');
        fb.className = 'feedback';
        fb.id = 'fb-' + data.id;
        content.appendChild(fb);
      }

      // ---------- TYPE: sequence ----------
      if (data.type === 'sequence') {
        const seqState = stepStates[data.id] || { clicked: [], done: false };
        const shuffled = seqState.shuffled || shuffle(data.items);
        if (!seqState.shuffled) {
          seqState.shuffled = shuffled;
          stepStates[data.id] = seqState;
        }

        const grid = document.createElement('div');
        grid.className = 'seq-grid';
        grid.id = 'seq-grid-' + data.id;

        shuffled.forEach((num) => {
          const item = document.createElement('div');
          item.className = 'seq-item';
          if (seqState.clicked.includes(num)) item.classList.add('done');
          item.textContent = num;
          item.dataset.num = num;
          item.addEventListener('click', () => handleSequence(data, num, grid, stepDiv));
          grid.appendChild(item);
        });
        content.appendChild(grid);

        const fb = document.createElement('div');
        fb.className = 'feedback';
        fb.id = 'fb-' + data.id;
        content.appendChild(fb);

        if (seqState.done) {
          const fbEl = document.getElementById('fb-' + data.id);
          fbEl.className = 'feedback show success';
          fbEl.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
          grid.querySelectorAll('.seq-item').forEach(el => el.classList.add('disabled'));
        }
      }

      // ---------- TYPE: matching ----------
      if (data.type === 'matching') {
        const matchState = stepStates[data.id] || {
          matched: [],
          selected: null,
          selectedEl: null,
          done: false,
          shuffledValues: shuffle(data.pairs.map(p => p.value)),
          shuffledNames: shuffle(data.pairs.map(p => p.name))
        };
        if (!stepStates[data.id]) stepStates[data.id] = matchState;

        const container = document.createElement('div');
        container.className = 'match-container';

        // Columna nombres
        const colN = document.createElement('div');
        colN.className = 'match-col';
        const labelN = document.createElement('div');
        labelN.className = 'col-label';
        labelN.textContent = 'Nombre';
        colN.appendChild(labelN);
        matchState.shuffledNames.forEach(name => {
          const el = document.createElement('div');
          el.className = 'match-item';
          el.textContent = name;
          el.dataset.type = 'name';
          el.dataset.value = name;
          if (matchState.matched.includes(name)) el.classList.add('matched');
          el.addEventListener('click', () => handleMatchingClick(data, el, container, stepDiv));
          colN.appendChild(el);
        });
        container.appendChild(colN);

        // Columna números
        const colV = document.createElement('div');
        colV.className = 'match-col';
        const labelV = document.createElement('div');
        labelV.className = 'col-label';
        labelV.textContent = 'Número';
        colV.appendChild(labelV);
        matchState.shuffledValues.forEach(val => {
          const el = document.createElement('div');
          el.className = 'match-item';
          el.textContent = val;
          el.dataset.type = 'value';
          el.dataset.value = val;
          if (matchState.matched.includes(val)) el.classList.add('matched');
          el.addEventListener('click', () => handleMatchingClick(data, el, container, stepDiv));
          colV.appendChild(el);
        });
        container.appendChild(colV);

        content.appendChild(container);

        const fb = document.createElement('div');
        fb.className = 'feedback';
        fb.id = 'fb-' + data.id;
        content.appendChild(fb);

        if (matchState.done) {
          const fbEl = document.getElementById('fb-' + data.id);
          fbEl.className = 'feedback show success';
          fbEl.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
          container.querySelectorAll('.match-item').forEach(el => el.classList.add('matched'));
        }
      }

      // ---------- TYPE: fillline (CORREGIDO: avance automático) ----------
      if (data.type === 'fillline') {
        const fillState = stepStates[data.id] || { filled: [], done: false };
        if (!stepStates[data.id]) stepStates[data.id] = fillState;

        const numline = document.createElement('div');
        numline.className = 'numline';

        for (let i = 1; i <= 10; i++) {
          const el = document.createElement('div');
          el.className = 'nl-item';
          if (data.visible.includes(i)) {
            el.textContent = i;
          } else {
            el.className += ' blank';
            const inp = document.createElement('input');
            inp.type = 'number';
            inp.min = 1;
            inp.max = 10;
            inp.dataset.pos = i;
            if (fillState.filled.includes(i)) {
              inp.value = i;
              el.classList.add('filled');
            }
            inp.addEventListener('input', function() {
              const val = parseInt(this.value);
              if (val === i) {
                el.classList.add('filled');
                if (!fillState.filled.includes(i)) fillState.filled.push(i);
              } else {
                el.classList.remove('filled');
                fillState.filled = fillState.filled.filter(v => v !== i);
              }
              // Verificar si todos los blanks están llenos
              const allFilled = data.blanks.every(b => fillState.filled.includes(b));
              if (allFilled && !fillState.done) {
                fillState.done = true;
                stepStates[data.id] = fillState;
                const fbEl = document.getElementById('fb-' + data.id);
                fbEl.className = 'feedback show success';
                fbEl.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
                launchConfetti(40);
                numline.querySelectorAll('.blank input').forEach(inp2 => inp2.disabled = true);
                // ===== AVANCE AUTOMÁTICO AL PASO 12 =====
                setTimeout(() => {
                  if (currentStep < stepsData.length - 1) {
                    currentStep++;
                    renderStep(currentStep);
                  }
                }, 1200);
              }
            });
            el.appendChild(inp);
          }
          numline.appendChild(el);
        }
        content.appendChild(numline);

        const fb = document.createElement('div');
        fb.className = 'feedback';
        fb.id = 'fb-' + data.id;
        content.appendChild(fb);

        if (fillState.done) {
          const fbEl = document.getElementById('fb-' + data.id);
          fbEl.className = 'feedback show success';
          fbEl.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
          numline.querySelectorAll('.blank input').forEach(inp => inp.disabled = true);
        }
      }

      // ---------- TYPE: final ----------
      if (data.type === 'final') {
        const box = document.createElement('div');
        box.className = 'final-box';
        const p = document.createElement('div');
        p.className = 'pregunta';
        p.innerHTML = `📌 ${data.question}`;
        box.appendChild(p);
        content.appendChild(box);

        const btn = document.createElement('button');
        btn.className = 'btn-primary centered';
        btn.textContent = data.buttonText || 'Ir al desarrollo';
        btn.addEventListener('click', () => {
          if (data.buttonLink) {
            window.location.href = data.buttonLink;
          } else {
            alert('¡Has completado la fase de inicio!');
          }
        });
        content.appendChild(btn);
      }

      stepDiv.appendChild(content);
      main.appendChild(stepDiv);
    }

    // ============================================================
    //  MANEJADORES DE INTERACCIÓN
    // ============================================================

    // --- choice ---
    function handleChoice(data, idx, container, stepDiv) {
      const btns = container.querySelectorAll('.opt');
      const fb = document.getElementById('fb-' + data.id);
      if (stepDiv.dataset.completed) return;

      btns.forEach(b => b.classList.add('disabled'));

      const isCorrect = (idx === data.correct);
      const btn = btns[idx];
      if (isCorrect) {
        btn.classList.add('correct');
        fb.className = 'feedback show success';
        fb.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
        stepDiv.dataset.completed = 'true';
        launchConfetti(40);
        setTimeout(() => {
          if (currentStep < stepsData.length - 1) {
            currentStep++;
            renderStep(currentStep);
          }
        }, 1200);
      } else {
        btn.classList.add('wrong');
        fb.className = 'feedback show error';
        fb.innerHTML = `<span class="fb-icon">💡</span> ${data.feedbackFail}`;
        setTimeout(() => {
          btns.forEach(b => b.classList.remove('disabled', 'wrong'));
          fb.className = 'feedback';
          fb.textContent = '';
        }, 1200);
      }
    }

    // --- input ---
    function handleInput(data, input, container, stepDiv) {
      if (stepDiv.dataset.completed) return;
      const fb = document.getElementById('fb-' + data.id);
      const val = parseInt(input.value);
      if (isNaN(val)) {
        fb.className = 'feedback show error';
        fb.innerHTML = `<span class="fb-icon">✏️</span> Escribe un número.`;
        return;
      }
      const isCorrect = (val === data.correct);
      if (isCorrect) {
        fb.className = 'feedback show success';
        fb.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
        stepDiv.dataset.completed = 'true';
        input.disabled = true;
        container.querySelector('button').disabled = true;
        launchConfetti(40);
        setTimeout(() => {
          if (currentStep < stepsData.length - 1) {
            currentStep++;
            renderStep(currentStep);
          }
        }, 1200);
      } else {
        fb.className = 'feedback show error';
        fb.innerHTML = `<span class="fb-icon">🔄</span> ${data.feedbackFail}`;
        input.value = '';
        input.focus();
        setTimeout(() => {
          fb.className = 'feedback';
          fb.textContent = '';
        }, 1500);
      }
    }

    // --- sequence ---
    function handleSequence(data, num, grid, stepDiv) {
      if (stepDiv.dataset.completed) return;
      const state = stepStates[data.id] || { clicked: [], done: false };
      if (state.done) return;
      const fb = document.getElementById('fb-' + data.id);

      const expected = data.sequence[state.clicked.length];
      if (num === expected) {
        state.clicked.push(num);
        const items = grid.querySelectorAll('.seq-item');
        items.forEach(el => {
          if (parseInt(el.dataset.num) === num) {
            el.classList.add('done');
          }
        });
        if (state.clicked.length === data.sequence.length) {
          state.done = true;
          stepStates[data.id] = state;
          fb.className = 'feedback show success';
          fb.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
          stepDiv.dataset.completed = 'true';
          grid.querySelectorAll('.seq-item').forEach(el => el.classList.add('disabled'));
          launchConfetti(40);
          setTimeout(() => {
            if (currentStep < stepsData.length - 1) {
              currentStep++;
              renderStep(currentStep);
            }
          }, 1200);
        } else {
          fb.className = 'feedback';
          fb.textContent = '';
        }
        stepStates[data.id] = state;
      } else {
        const items = grid.querySelectorAll('.seq-item');
        items.forEach(el => {
          if (parseInt(el.dataset.num) === num) {
            el.classList.add('wrong-flash');
            setTimeout(() => el.classList.remove('wrong-flash'), 600);
          }
        });
        fb.className = 'feedback show error';
        fb.innerHTML = `<span class="fb-icon">⛔</span> ${data.feedbackFail}`;
        setTimeout(() => {
          fb.className = 'feedback';
          fb.textContent = '';
        }, 1200);
      }
    }

    // --- matching ---
    function handleMatchingClick(data, el, container, stepDiv) {
      if (stepDiv.dataset.completed) return;
      const state = stepStates[data.id];
      if (state.done) return;
      const fb = document.getElementById('fb-' + data.id);

      const type = el.dataset.type;
      const value = el.dataset.value;

      if (state.matched.includes(value)) return;

      if (!state.selected) {
        container.querySelectorAll('.match-item.selected').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        state.selected = { type, value, el };
        stepStates[data.id] = state;
        fb.className = 'feedback';
        fb.textContent = '';
        return;
      }

      const first = state.selected;
      if (first.el === el) {
        el.classList.remove('selected');
        state.selected = null;
        stepStates[data.id] = state;
        return;
      }

      if (first.type === type) {
        first.el.classList.remove('selected');
        el.classList.add('selected');
        state.selected = { type, value, el };
        stepStates[data.id] = state;
        return;
      }

      const nameVal = type === 'name' ? value : first.value;
      const numVal = type === 'value' ? value : first.value;
      const pair = data.pairs.find(p => p.name === nameVal && p.value === parseInt(numVal)) ||
        data.pairs.find(p => p.name === nameVal || p.value === parseInt(numVal));

      if (pair && pair.name === nameVal && pair.value === parseInt(numVal)) {
        const nameEl = type === 'name' ? el : first.el;
        const numEl = type === 'value' ? el : first.el;
        nameEl.classList.remove('selected');
        nameEl.classList.add('matched');
        numEl.classList.remove('selected');
        numEl.classList.add('matched');
        state.matched.push(nameVal, parseInt(numVal));
        state.selected = null;
        stepStates[data.id] = state;

        const allMatched = data.pairs.every(p => state.matched.includes(p.name) && state.matched.includes(p.value));
        if (allMatched) {
          state.done = true;
          stepStates[data.id] = state;
          fb.className = 'feedback show success';
          fb.innerHTML = `<span class="fb-icon">🎉</span> ${data.feedbackOk}`;
          stepDiv.dataset.completed = 'true';
          launchConfetti(50);
          setTimeout(() => {
            if (currentStep < stepsData.length - 1) {
              currentStep++;
              renderStep(currentStep);
            }
          }, 1200);
        } else {
          fb.className = 'feedback show success';
          fb.innerHTML = `<span class="fb-icon">✅</span> ¡Par correcto! Sigue con los demás.`;
          setTimeout(() => {
            fb.className = 'feedback';
            fb.textContent = '';
          }, 1000);
        }
      } else {
        el.classList.add('wrong-pair');
        first.el.classList.add('wrong-pair');
        fb.className = 'feedback show error';
        fb.innerHTML = `<span class="fb-icon">❌</span> ${data.feedbackFail}`;
        setTimeout(() => {
          el.classList.remove('wrong-pair');
          first.el.classList.remove('wrong-pair');
          first.el.classList.remove('selected');
          state.selected = null;
          stepStates[data.id] = state;
          fb.className = 'feedback';
          fb.textContent = '';
        }, 1000);
      }
    }

    // ============================================================
    //  INICIO
    // ============================================================
    renderStep(0);
  </script>
</body>
</html>
